services:
  autobuaa:
    image: ghcr.io/operapeking/autobuaa:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autobuaa
    restart: unless-stopped
    ports:
      - "${AUTOBUAA_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      AUTOBUAA_DATA_DIR: /data
      AUTOBUAA_LOG_LEVEL: ${AUTOBUAA_LOG_LEVEL:-DEBUG}
      AUTOBUAA_COOKIE_SECURE: ${AUTOBUAA_COOKIE_SECURE:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
